name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            shard: 1/2
          - node: 24
          - node: 26
            shard: 2/2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Cache Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install
        run: bun ci
      # Transform cache for test.fsModuleCache; entries are keyed by source
      # content, and vitest clears the cache itself when the lockfile changes.
      - name: Cache Vitest transform cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vitest-cache
          key: ${{ runner.os }}-vitest-${{ hashFiles('bun.lock', 'vitest.config.ts') }}
      # Lint, formatting, typecheck, docs, and API checks do not depend on Node;
      # run the complete gate once on node 24. Runtime lanes verify the package
      # against the other supported Node versions, each running half the test
      # suite via TEST_SHARD so the pair covers the full set once.
      - name: Check
        if: matrix.node == 24
        run: make check
      - name: Test and pack
        if: matrix.node != 24
        run: |
          bun run build
          TEST_SHARD='${{ matrix.shard }}' bun run --silent test:shard
          bun run --silent pack:verify
      - name: Summarize public API report diff
        if: github.event_name == 'pull_request' && matrix.node == 24
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          node scripts/summarize-api-report-diff.mjs --git-base "origin/${{ github.base_ref }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Confirm Node used for pack smoke
        run: node --version
      - name: Upload Tubeless trace
        if: always() && matrix.node == 24
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tubeless-check-node-${{ matrix.node }}
          path: logs/check.ndjson
          if-no-files-found: warn
          retention-days: 7
