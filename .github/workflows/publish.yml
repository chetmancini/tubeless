name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes to cut a new tag (first line is the summary). Optional when the version tag already exists (retry publish)."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  cut:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Cut version tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Cut releases from main (ref ${GITHUB_REF})" >&2
            exit 1
          fi
          version="$(node -p 'require("./package.json").version')"
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists; skipping tag"
            if ! gh release view "${tag}" >/dev/null 2>&1; then
              git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
              bash scripts/publish-github-release.sh "${tag}"
            fi
            exit 0
          fi
          if [[ -z "${NOTES}" ]]; then
            echo "notes input is required to cut ${tag}" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "${NOTES}"
          git push origin "${tag}"
          bash scripts/publish-github-release.sh "${tag}"

  publish:
    needs: [cut]
    if: always() && !cancelled() && (github.event_name == 'push' || needs.cut.result == 'success')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require tag to match package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          tag="${GITHUB_REF_NAME}"
          if [[ "${tag}" != "v${version}" ]]; then
            echo "tag ${tag} does not match package.json version ${version}" >&2
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Require npm CLI 11.5.1+
        run: |
          set -euo pipefail
          npm install -g npm@11
          node -e 'const [maj, min, pat] = process.versions.node.split(".").map(Number); if (maj < 22 || (maj === 22 && min < 14)) { console.error(process.versions.node); process.exit(1) }'
          node -e 'const {execSync} = require("node:child_process"); const v = execSync("npm --version",{encoding:"utf8"}).trim(); const [maj, min] = v.split(".").map(Number); if (maj < 11 || (maj === 11 && min < 5)) { console.error(v); process.exit(1) } console.log("npm", v)'
      - name: Install
        run: bun ci
      - name: Check
        run: make check
      - name: Publish
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if npm view "tubeless@${version}" version >/dev/null 2>&1; then
            echo "tubeless@${version} is already on the registry; skipping publish"
            exit 0
          fi
          npm pkg delete private
          if [[ "${version}" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
