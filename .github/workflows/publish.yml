name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Require npm CLI 11.5.1+
        run: |
          set -euo pipefail
          npm install -g npm@11
          node -e 'const [maj, min, pat] = process.versions.node.split(".").map(Number); if (maj < 22 || (maj === 22 && min < 14)) { console.error(process.versions.node); process.exit(1) }'
          node -e 'const {execSync} = require("node:child_process"); const v = execSync("npm --version",{encoding:"utf8"}).trim(); const [maj, min] = v.split(".").map(Number); if (maj < 11 || (maj === 11 && min < 5)) { console.error(v); process.exit(1) } console.log("npm", v)'
      - name: Install
        run: bun ci
      - name: Check
        run: make check
      - name: Publish
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if npm view "tubeless@${version}" version >/dev/null 2>&1; then
            echo "tubeless@${version} is already on the registry; skipping publish"
            exit 0
          fi
          npm pkg delete private
          npm publish --access public
