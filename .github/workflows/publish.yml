name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cut:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Cut version tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Cut releases from main (ref ${GITHUB_REF})" >&2
            exit 1
          fi
          version="$(node -p 'require("./package.json").version')"
          tag="v${version}"
          latest_tag="$(git -c versionsort.suffix=- tag -l 'v*' --sort=-version:refname | awk 'NR == 1 { print; exit }')"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            if [[ -n "${latest_tag}" ]]; then
              bash scripts/check-release-version.sh "${version}" "${latest_tag#v}" newer-or-equal
            fi
            echo "${tag} already exists; skipping tag"
          else
            if [[ -n "${latest_tag}" ]]; then
              bash scripts/check-release-version.sh "${version}" "${latest_tag#v}"
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" -m "tubeless ${version}"
            git push origin "${tag}"
          fi
          commit="$(bash scripts/check-release-commit.sh "${tag}")"
          printf 'tag=%s\ncommit=%s\n' "${tag}" "${commit}" >> "${GITHUB_OUTPUT}"

  verify:
    needs: [cut]
    if: always() && !cancelled() && (github.event_name == 'push' || needs.cut.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.cut.outputs.commit || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Require release commit on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "release commit $(git rev-parse HEAD) is not on main" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install
        run: bun ci
      - name: Check
        run: make check
      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/package"
          npm pkg delete private
          npm pack --pack-destination "${RUNNER_TEMP}/package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [cut, verify]
    if: always() && !cancelled() && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    environment: npm
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.cut.outputs.commit || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Require release tag to match package and commit
        id: release
        env:
          RELEASE_TAG: ${{ needs.cut.outputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          tag="${RELEASE_TAG}"
          if [[ "${tag}" != "v${version}" ]]; then
            echo "tag ${tag} does not match package.json version ${version}" >&2
            exit 1
          fi
          commit="$(bash scripts/check-release-commit.sh "${tag}")"
          printf 'tag=%s\ncommit=%s\n' "${tag}" "${commit}" >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - name: Require npm CLI 11.5.1+
        run: |
          set -euo pipefail
          npm install -g npm@11.21.0
          node -e 'const [maj, min, pat] = process.versions.node.split(".").map(Number); if (maj < 22 || (maj === 22 && min < 14)) { console.error(process.versions.node); process.exit(1) }'
          node -e 'const {execSync} = require("node:child_process"); const v = execSync("npm --version",{encoding:"utf8"}).trim(); const [maj, min] = v.split(".").map(Number); if (maj < 11 || (maj === 11 && min < 5)) { console.error(v); process.exit(1) } console.log("npm", v)'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/package
      - name: Publish
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if npm view "tubeless@${version}" version >/dev/null 2>&1; then
            echo "tubeless@${version} is already on the registry; skipping publish"
            exit 0
          fi
          tarball="${RUNNER_TEMP}/package/tubeless-${version}.tgz"
          test -f "${tarball}"
          if [[ "${version}" == *-* ]]; then
            npm publish "${tarball}" --access public --tag next
          else
            npm publish "${tarball}" --access public
          fi

  github-release:
    needs: [publish]
    # Announce a release only after its version reached the registry.
    if: always() && !cancelled() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.commit }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            exit 0
          fi
          args=(--verify-tag --generate-notes)
          if [[ "${tag}" == *-* ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "${tag}" "${args[@]}"
