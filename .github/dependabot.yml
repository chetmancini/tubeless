version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    ignore:
      # Keep Node types at the supported engines.node floor (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      bun:
        patterns:
          - "*"

  - package-ecosystem: bun
    directory: /website
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      bun-website:
        patterns:
          - "*"
