name: Tubeless
description: Plan, dry-run, or run a Tubeless pipeline and publish the plan with its Mermaid graph.
author: Chet Mancini
branding:
  icon: git-pull-request
  color: green

inputs:
  pipeline:
    description: Pipeline id or file path passed to the tubeless CLI.
    required: true
  mode:
    description: "plan (default), dry-run, or run."
    required: false
    default: plan
  node-version:
    description: Node.js version for actions/setup-node.
    required: false
    default: "22"
  working-directory:
    description: Directory the tubeless CLI runs in.
    required: false
    default: "."
  comment:
    description: Post or update one sticky pull request comment with the plan and Mermaid graph.
    required: false
    default: "true"
  summary:
    description: Append the plan and Mermaid graph to the job summary.
    required: false
    default: "true"
  cloud-token:
    description: >-
      Tubeless Cloud token. With mode run, reserved for Cloud HTTP dispatch.
      That API is not documented in this repository, so the action fails
      instead of running locally.
    required: false
    default: ""

outputs:
  plan:
    description: Stdout from tubeless plan.
    value: ${{ steps.report.outputs.plan }}
  mermaid:
    description: Mermaid flowchart from tubeless graph.
    value: ${{ steps.report.outputs.mermaid }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.3.14"
    - name: Plan, graph, and publish
      id: report
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_PIPELINE: ${{ inputs.pipeline }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_CLOUD_TOKEN: ${{ inputs.cloud-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_TOKEN: ${{ github.token }}
      run: bun "${{ github.action_path }}/action/run.ts"
