  <rect width="240" height="12" fill="#0085ca" />
  <rect x="240" width="240" height="12" fill="#e30613" />
  <rect x="480" width="240" height="12" fill="#121212" />
  <rect x="720" width="240" height="12" fill="#ffd100" />
  <rect x="960" width="240" height="12" fill="#00a651" />

