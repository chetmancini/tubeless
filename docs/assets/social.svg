<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="Tubeless: a typed pipeline graph from load through validate and normalize to publish and deploy">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500&amp;display=swap");
      .display { font-family: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif; font-weight: 800; }
      .sans { font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-weight: 500; }
      .green { --object-light: #c0dbc7; --object-mid: #87b39e; --object-dark: #527d6c; }
      .blue { --object-light: #c1deec; --object-mid: #81afc8; --object-dark: #507d98; }
    </style>
    <pattern id="floor" width="80" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 80 20 40 40 0 20Z" fill="none" stroke="#b5c3b3" stroke-width="0.7" />
    </pattern>
    <radialGradient id="floor-fade">
      <stop stop-color="white" />
      <stop offset="1" stop-color="black" />
    </radialGradient>
    <mask id="floor-mask">
      <ellipse cx="640" cy="360" rx="620" ry="250" fill="url(#floor-fade)" />
    </mask>
    <radialGradient id="gold-mist" cx="92%" cy="8%" r="55%">
      <stop stop-color="rgb(213 183 111 / 0.22)" />
      <stop offset="1" stop-color="rgb(213 183 111 / 0)" />
    </radialGradient>
