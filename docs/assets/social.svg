    </g>
    <g style="offset-path: path('M533 483 C605 483 605 360 677 360'); offset-distance: 48%; offset-rotate: 0deg; offset-anchor: 0px 0px">
      <use href="#cargo" />
    </g>
    <g style="offset-path: path('M803 360 C870 360 870 360 937 360'); offset-distance: 55%; offset-rotate: 0deg; offset-anchor: 0px 0px">
      <use href="#cargo" />
