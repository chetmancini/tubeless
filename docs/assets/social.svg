      <path d="M533 483 C605 483 605 360 677 360" stroke="#f9faf0" stroke-width="8" />
      <path d="M533 483 C605 483 605 360 677 360" stroke="#e2e7d8" stroke-width="1" />

      <path d="M803 360 C870 360 870 360 937 360" stroke="#879c8d" stroke-width="15" opacity="0.15" transform="translate(0 5)" />
      <path d="M803 360 C870 360 870 360 937 360" stroke="#bcc7b9" stroke-width="12" />
      <path d="M803 360 C870 360 870 360 937 360" stroke="#f9faf0" stroke-width="8" />
