    <text class="mono" x="0" y="104" text-anchor="middle" fill="#42524a" font-size="16" paint-order="stroke" stroke="#f3f6e9" stroke-width="5" stroke-linejoin="round">Publish</text>
  </g>
  <g transform="translate(1000 335)">
