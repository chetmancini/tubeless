# yaml-language-server: $schema=https://tubeless.io/schemas/pipeline-document-v1.schema.json
$schema: https://tubeless.io/schemas/pipeline-document-v1.schema.json
version: 1
metadata:
  name: Row import examples
  description: Ordinary, composed, and fan-out pipelines that share application handlers.

pipelines:
  yaml-import:
    name: Import rows from YAML
    description: Normalize caller-provided rows through the reusable child workflow.
    optionsSchema: lines
    targets: [normalize]
    steps:
      - id: normalize
        description: Normalize all caller-provided lines through the reusable child workflow.
        fromPipeline:
          pipeline: normalize-all
          adapter: allRows
        skip: noRows
    finalize:
      run: normalizedRows
      requireOutputs: [normalize]

  yaml-preview:
    name: Preview rows from YAML
    description: Return caller-provided rows without normalization.
    optionsSchema: lines
    targets: [load]
    steps:
      - id: load
        description: Preview the original input lines.
        run: loadRows
    finalize:
      run: originalRows
      requireOutputs: [load]

  normalize-all:
    name: Normalize rows
    description: Normalize every non-empty row through its own child run.
    optionsSchema: lines
    steps:
      - id: normalize
        description: Normalize each non-empty line through its own child run.
        forEachPipeline:
          pipeline: normalize-one
          adapter: eachRow
        skip: noRows
    finalize:
      run: normalizedRows
      requireOutputs: [normalize]

  normalize-one:
    name: Normalize one row
    description: Trim and lowercase one row.
    optionsSchema: line
    steps:
      - id: normalize
        description: Trim and lowercase one line.
        run: normalizeLine
    finalize:
      run: normalizedLine
      requireOutputs: [normalize]
